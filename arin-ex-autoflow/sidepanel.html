<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arin Flow Extension</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 12px;
            background: #111827;
            color: #f9fafb;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        .section {
            margin-bottom: 14px;
            padding: 12px;
            background: #1f2937;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #d1d5db;
        }

        input[type="file"],
        textarea,
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 10px;
            background: #0f172a;
            color: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 12px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        button.secondary {
            background: #374151;
        }

        button.warn {
            background: #d97706;
        }

        button.success {
            background: #059669;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .small {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 6px;
        }

        #status {
            font-size: 13px;
            color: #93c5fd;
            margin-top: 8px;
            white-space: pre-wrap;
        }

        #log {
            margin-top: 10px;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            height: 260px;
            overflow: auto;
            font-family: Consolas, monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .count {
            margin-top: 6px;
            font-size: 12px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>
    <h2>Arin Flow Extension</h2>

    <div class="section">
        <label for="flowUrl">Flow URL</label>
        <input id="flowUrl" type="text" placeholder="https://labs.google/fx/tools/flow or current Flow page"
            value="https://labs.google/fx/tools/flow" />
        <div class="small">เปลี่ยน URL ได้ถ้าหน้า Flow ของคุณเป็นอีก path หนึ่ง</div>
    </div>

    <div class="section">
        <label for="imageInput">Upload Images</label>
        <input id="imageInput" type="file" accept="image/*" multiple />
        <div id="imageCount" class="count">Selected images: 0</div>
    </div>

    <div class="section">
        <label for="promptInput">Prompt</label>
        <textarea id="promptInput" placeholder="Enter prompt here..."></textarea>
    </div>

    <div class="section">
        <div class="row">
            <button id="btnFindTab" class="secondary">Find/Open Flow</button>
            <button id="btnInject" class="secondary">Inject Script</button>
        </div>

        <div class="row">
            <button id="btnSelectors">Test Selectors</button>
            <button id="btnPrompt">Test Prompt</button>
        </div>

        <div class="row">
            <button id="btnUpload" class="warn">Test Upload</button>
            <button id="btnGenerate" class="warn">Test Generate</button>
        </div>

        <div class="row">
            <button id="btnRunFull" class="success">Run Full</button>
            <button id="btnClearLog" class="secondary">Clear Log</button>
        </div>

        <div id="status">Ready.</div>
    </div>

    <div class="section">
        <label>Logs</label>
        <div id="log"></div>
    </div>

    <script src="sidepanel.js"></script>
</body>

</html>
