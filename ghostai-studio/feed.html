<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostAI Studio - Feed</title>
    <link href="./output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex min-h-screen overflow-x-hidden selection:bg-crimson-800 selection:text-white antialiased">
    <aside class="w-64 h-screen sticky top-0 glass-panel border-r border-crimson-900/50 flex flex-col z-20 shrink-0">
        <div class="p-6 flex items-center gap-3 border-b border-crimson-900/50">
            <div class="p-2 bg-crimson-900/30 rounded-lg text-crimson-500 animate-pulse-slow"><i data-lucide="ghost"></i></div>
            <h1 class="text-xl font-bold tracking-wider text-white">GhostAI<span class="text-crimson-500">.</span></h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 relative">
            <a href="./index.html" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent hover:bg-crimson-900/20 text-gray-400 hover:text-gray-200">
                <i data-lucide="wand-2" class="w-5 h-5 text-gray-500"></i><span class="font-medium tracking-wide">AI Studio</span>
            </a>
            <a href="./feed.html" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent hover:bg-crimson-900/20 text-gray-200 bg-crimson-900/10 border-crimson-800/50 crimson-glow tab-active">
                <i data-lucide="radio" class="w-5 h-5 text-crimson-400"></i><span class="font-medium tracking-wide">The Ghost Radio</span>
            </a>
            <a href="./ouija.html" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent hover:bg-crimson-900/20 text-gray-400 hover:text-gray-200">
                <i data-lucide="layout" class="w-5 h-5 text-gray-500"></i><span class="font-medium tracking-wide">Ouija Board</span>
            </a>
            <a href="./story-ritual.html" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent hover:bg-crimson-900/20 text-gray-400 hover:text-gray-200">
                <i data-lucide="book-open" class="w-5 h-5 text-gray-500"></i><span class="font-medium tracking-wide">Personalized Ritual</span>
            </a>
            <a href="./tarot.html" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent hover:bg-crimson-900/20 text-gray-400 hover:text-gray-200">
                <i data-lucide="clover" class="w-5 h-5 text-gray-500"></i><span class="font-medium tracking-wide">Spirit Tarot</span>
            </a>
            <a href="./settings.html" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent hover:bg-crimson-900/20 text-gray-400 hover:text-gray-200">
                <i data-lucide="settings" class="w-5 h-5 text-gray-500"></i><span class="font-medium tracking-wide">ตั้งค่า (Settings)</span>
            </a>
        </nav>
        <div class="p-4 border-t border-crimson-900/50">
            <div class="flex items-center justify-between px-4 py-3 bg-dark-900/80 rounded-xl border border-dark-600 shadow-inner">
                <span class="text-xs font-semibold text-gray-400 tracking-wider">SYSTEM</span>
                <div class="flex items-center gap-2"><span class="text-xs text-green-500 font-medium tracking-wider">ONLINE</span><div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div></div>
            </div>
        </div>
    </aside>
    <main class="flex-1 flex flex-col min-w-0 relative bg-transparent">
        <header class="sticky top-0 h-16 glass-panel border-b border-crimson-900/30 flex items-center justify-between px-8 z-10 shrink-0">
            <h2 class="text-lg font-semibold text-gray-200 tracking-wide">The Ghost Radio Feed (คลื่นหลอนย้อนหลัง)</h2>
            <div class="flex items-center gap-5">
                <button class="text-gray-400 hover:text-crimson-400 transition-colors relative group"><i data-lucide="bell" class="w-5 h-5"></i><span class="absolute top-0 right-0 w-2 h-2 bg-crimson-500 rounded-full border border-dark-900 group-hover:animate-ping"></span></button>
                <div class="h-8 px-3 rounded-lg bg-gradient-to-r from-crimson-800 to-crimson-600 border border-crimson-500 flex items-center justify-center text-xs font-bold text-white shadow-lg tracking-wider">VIP LOCAL</div>
            </div>
        </header>
        <div class="flex-1 flex flex-col items-stretch justify-start p-4 md:p-8 relative">
            <section class="w-full max-w-6xl mx-auto self-start space-y-6 animate-fade-in pb-8">
                <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 pb-4 border-b border-crimson-900/30 gap-4">
                    <div>
                        <h2 class="text-3xl font-bold text-white tracking-widest flex items-center gap-3">
                            <i data-lucide="radio" class="text-crimson-500 w-8 h-8"></i>
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">คลื่นหลอน</span>
                            <span class="text-crimson-600 font-black">THE GHOST RADIO</span>
                        </h2>
                        <p class="text-gray-400 mt-2 text-sm tracking-wide">รวมเรื่องเล่าสยองขวัญ ฟีดตรงจาก YouTube (ดึงผ่าน RSS)</p>
                    </div>
                    <button class="px-5 py-2.5 bg-dark-800/80 border border-dark-600 hover:border-crimson-600 hover:bg-dark-700 rounded-xl text-sm font-medium text-gray-300 hover:text-white transition-all shadow-md flex items-center gap-2 group" onclick="fetchYouTubeRSS()">
                        <i data-lucide="refresh-ccw" class="w-4 h-4 group-hover:rotate-180 transition-transform duration-500"></i>รีเฟรชคลื่น
                    </button>
                </div>
                <div id="feed-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <div class="col-span-full h-40 flex items-center justify-center text-crimson-600/50"><i data-lucide="skull" class="w-10 h-10 animate-pulse"></i></div>
                </div>
            </section>
        </div>
    </main>
    <script>
        lucide.createIcons();
        function parseYouTubeFeedXml(xmlText) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, 'text/xml');
            return Array.from(xml.querySelectorAll('entry')).map(entry => ({
                title: entry.querySelector('title')?.textContent?.trim() || 'Untitled',
                link: entry.querySelector('link')?.getAttribute('href') || 'https://youtube.com',
                pubDate: entry.querySelector('published')?.textContent || new Date().toISOString(),
                thumbnail: entry.querySelector('media\\:thumbnail, thumbnail')?.getAttribute('url') || ''
            })).filter(item => item.link);
        }
        function renderFeed(items) {
            const container = document.getElementById('feed-container');
            container.innerHTML = items.map(item => {
                const thumbnail = item.thumbnail || 'https://images.unsplash.com/photo-1505635552518-3448ff116af3?q=80&w=600&auto=format&fit=crop';
                const date = new Date(item.pubDate).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                return `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="group rounded-2xl overflow-hidden border border-crimson-950/70 bg-dark-900/80 hover:border-crimson-700 transition-all hover:-translate-y-1 shadow-lg">
                    <div class="relative aspect-video bg-black overflow-hidden">
                        <img src="${thumbnail}" alt="thumb" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                        <div class="absolute top-3 right-3 px-3 py-1 rounded-md bg-black/70 border border-white/10 text-[10px] text-white flex items-center gap-1"><i data-lucide="play" class="w-3 h-3 text-red-500"></i>YouTube</div>
                    </div>
                    <div class="p-4 space-y-3">
                        <h3 class="font-semibold text-gray-100 leading-snug line-clamp-2">${item.title}</h3>
                        <div class="flex items-center justify-between text-xs text-gray-500">
                            <span class="px-2 py-1 rounded-md bg-crimson-950/60 text-crimson-400 border border-crimson-900/50">เรื่องเล่า</span>
                            <span class="flex items-center gap-1"><i data-lucide="calendar-days" class="w-3 h-3"></i>${date}</span>
                        </div>
                    </div>
                </a>`;
            }).join('');
            lucide.createIcons();
            requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: 'auto' }));
        }
        async function fetchYouTubeRSS() {
            const container = document.getElementById('feed-container');
            container.innerHTML = `<div class="col-span-full py-20 flex flex-col items-center justify-center text-crimson-500/80"><i data-lucide="radar" class="w-12 h-12 animate-spin-slow mb-4"></i><p class="tracking-widest font-semibold text-sm animate-pulse">กำลังปรับจูนคลื่นวิญญาณ...</p></div>`;
            lucide.createIcons();
            const mockData = [
                { title: 'ห้องข้างหมายเลข 404 | คุณ A', link: 'https://youtube.com', thumbnail: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop', pubDate: new Date().toISOString() },
                { title: 'ทางเปลี่ยวคืนนั้น | คุณ B', link: 'https://youtube.com', thumbnail: 'https://images.unsplash.com/photo-1626245137107-7756e1cd4ece?q=80&w=600&auto=format&fit=crop', pubDate: new Date(Date.now() - 86400000).toISOString() },
                { title: 'วิญญาณตามติด | คุณ C', link: 'https://youtube.com', thumbnail: 'https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=600&auto=format&fit=crop', pubDate: new Date(Date.now() - 172800000).toISOString() },
                { title: 'เสียงเคาะจากตู้ | คุณ D', link: 'https://youtube.com', thumbnail: 'https://images.unsplash.com/photo-1505635552518-3448ff116af3?q=80&w=600&auto=format&fit=crop', pubDate: new Date(Date.now() - 259200000).toISOString() }
            ];
            if (window.location.protocol === 'file:') {
                console.warn('[GhostAI] Feed fetch skipped on file:// origin because remote proxies are blocked by browser CORS policy');
                renderFeed(mockData);
                return;
            }
            try {
                const rssUrl = 'https://www.youtube.com/feeds/videos.xml?channel_id=UCM246zZ4qMNmDw8JOPjFquw';
                const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const items = parseYouTubeFeedXml(await res.text());
                if (!items.length) throw new Error('No items');
                renderFeed(items);
            } catch (err) {
                console.warn('[GhostAI] Fetch RSS Failed, loading Mock Data', err);
                renderFeed(mockData);
            }
        }
        window.addEventListener('DOMContentLoaded', fetchYouTubeRSS);
    </script>
</body>
</html>
